apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: novari-no
resources:
  - ../../../base
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: dmarc-analyzer
      app.kubernetes.io/instance: dmarc-analyzer_novari-no
      app.kubernetes.io/version: "0.15.0"
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: it-operations
      fintlabs.no/org-id: novari.no
      fintlabs.no/team: flais
patches:
  - patch: |-
      - op: add
        path: /spec/ingress
        value:
          routes:
            - host: dmarc-beta.novari.no
    target:
      kind: Application
      name: dmarc-analyzer
  - patch: |-
      - op: replace
        path: /spec/itemPath
        value: vaults/aks-beta-vault/items/novari-dmarc-analyzer
    target:
      kind: OnePasswordItem
      name: novari-dmarc-analyzer
  - patch: |-
      - op: replace
        path: /spec/itemPath
        value: vaults/aks-beta-vault/items/novari-dmarc-collector
    target:
      kind: OnePasswordItem
      name: novari-dmarc-collector

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: novari-no
resources:
  - ../../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/itemPath
        value: vaults/aks-beta-vault/items/dmarc-analyzer
    target:
      kind: OnePasswordItem
      name: dmarc-analyzer
